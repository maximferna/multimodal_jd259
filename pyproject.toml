[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maximferna-multimodal_jd259"
version = "0.1.0"
description = "按段落统计多模态算法研究员·推理链路的追踪埋点相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "maximferna" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://maximferna.github.io"
Repository = "https://github.com/maximferna/multimodal_jd259"
Issues = "https://github.com/maximferna/multimodal_jd259/issues"

[project.scripts]
multimodal_jd259 = "multimodal_jd259:main"

[tool.setuptools]
py-modules = ["multimodal_jd259"]
